spring.application.name=evidencia1

server.address=localhost
server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=evidencia1
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Registra en el log los handshakes TLS fallidos (p. ej., un cliente con TLS 1.1)
logging.level.org.apache.tomcat.util.net.NioEndpoint.handshake=DEBUG
