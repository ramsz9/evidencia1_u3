services:
  postgres:
    image: postgres:17-alpine
    container_name: evidencia1_db
    environment:
      POSTGRES_DB: evidencia1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidencia1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: evidencia1_app
    environment:
      # Dentro del contenedor la app escucha HTTP en 8080; el TLS lo termina Caddy
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evidencia1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: evidencia1_proxy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HOST_IP:-127.0.0.1}:80:80"
      - "${HOST_IP:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
